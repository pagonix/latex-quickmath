# latex-quickmath — quick LaTeX maths for espanso
#
# Every trigger starts with ":" and fires on the trailing space, so ":in "
# expands while ":integral" is left alone. In a replacement, "$|$" marks where
# the cursor lands afterwards; an empty "{  }" is a slot for you to fill in.
#
# Sections below are marked with "# -- Name --" comments; the cheatsheet at
# https://pagonix.github.io/latex-quickmath/ is generated from them.

matches:
