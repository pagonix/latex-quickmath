  - trigger: ":c "
    replace: "{ $|$ }"

  - trigger: ":r "
    replace: "( $|$ )"

  - trigger: ":s "
    replace: "[ $|$ ]"

  # -- Set theory --

  - trigger: ":emptyset "
    replace: "\\varnothing"

  - trigger: ":set: "
    replace: "\\{ $|$ \\}"

  - trigger: ":setcondition "
    replace: "\\{ $|$ \\mid  \\}"

  - trigger: ":cup "
    replace: "\\cup"

  - trigger: ":bigcup "
    replace: "\\bigcup_{ $|$ }^{  }{  }"

  - trigger: ":bigcupin "
    replace: "\\bigcup_{ $|$ }{  }"

